# devflow 项目真源配置。可以自由修改，改完运行 node scripts/devflow-gen.mjs。
version: 1
requiresPlugin: "^1.0.0"

stages:
  - req
  - plan
  - implement
  - test
  - review
  - debug

# 多根工作区：每个子项目可声明参与哪些阶段与自己的测试命令。
# 单项目可以保留 subprojects: {}，只依赖 defaults。
subprojects: {}

defaults:
  testCommand: "npm test"
  reviewRequired: true

# 回灌时用于识别项目专属内容的关键词，命中则不回灌到插件模板。
upstream:
  blocklist: []
