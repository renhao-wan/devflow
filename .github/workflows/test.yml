name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]
        exclude:
          - os: windows-latest
            node: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: 版本
        run: node --version
      - name: 单元与集成测试
        run: node --test tests/

  smoke:
    name: init → doctor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 在临时目录初始化并体检
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cd "$work"
          printf '{"name":"smoke","scripts":{"test":"node --test"}}' > package.json
          node "$GITHUB_WORKSPACE/scripts/hub-init.mjs" --root . --plugin-root "$GITHUB_WORKSPACE"
          node "$GITHUB_WORKSPACE/scripts/gen-claude-skills.mjs" --root . --check
          node "$GITHUB_WORKSPACE/scripts/hub-doctor.mjs" --root .
